name: gitleaks

# Secret scanning via the gitleaks CLI (license-free). PR + nightly.
# Allow-list in .gitleaks.toml (cosign.pub PEM blocks). ADDITIVE. Doctrine v11 LOCKED 749/14/163 locked_at c7c0ba17
# Note: gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE; we run the OSS binary directly instead.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '7 1 * * *'   # nightly 01:07 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.21.2
          ARCHIVE="$RUNNER_TEMP/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output "$ARCHIVE"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Gitleaks scan
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --verbose \
            --exit-code 1
